<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BicicletasAdan - Venta de Bicicletas y Accesorios</title>
  <meta name="description" content="BicicletasAdan: Venta de bicicletas nuevas, repuestos y accesorios. ¡Compra directo por WhatsApp!">
  <style>
    :root {
      --primary: #25d366;
      --dark: #0f172a;
      --accent: #0284c7;
      --card-bg: #ffffff;
      --text: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f1f5f9; color: var(--text); padding-bottom: 90px; }
    
    header {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white; padding: 2.5rem 1rem; text-align: center;
    }
    .logo-container { max-width: 380px; margin: 0 auto; }
    header p { color: #94a3b8; font-size: 0.95rem; margin-top: 8px; }

    .converter-bar {
      background: #ffffff; max-width: 800px; margin: -20px auto 20px;
      padding: 15px 20px; border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; width: 90%;
    }
    .converter-bar input { width: 100px; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-weight: 700; }

    .filters { display: flex; justify-content: center; gap: 8px; margin: 1.5rem auto; flex-wrap: wrap; max-width: 800px; padding: 0 10px; }
    .filter-btn { background: white; border: 1px solid #cbd5e1; padding: 8px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; }
    .filter-btn.active, .filter-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }

    .container { max-width: 1100px; margin: 0 auto; padding: 0 15px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }

    .card { background: var(--card-bg); border-radius: 16px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
    
    /* Estilos del Carrusel */
    .carousel { position: relative; width: 100%; height: 240px; background: #e2e8f0; overflow: hidden; }
    .carousel-track { display: flex; width: 100%; height: 100%; transition: transform 0.35s ease-in-out; }
    .carousel-slide { min-width: 100%; width: 100%; height: 100%; flex-shrink: 0; }
    .carousel-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
    
    .carousel-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(0,0,0,0.6); color: white; border: none;
      width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-weight: bold; z-index: 5;
    }
    .carousel-btn.prev { left: 8px; }
    .carousel-btn.next { right: 8px; }
    .carousel-btn:hover { background: rgba(0,0,0,0.85); }

    .carousel-dots {
      position: absolute; bottom: 8px; width: 100%;
      display: flex; justify-content: center; gap: 4px; z-index: 5;
      padding: 0 5px; overflow-x: auto;
    }
    .dot { width: 6px; height: 6px; background: rgba(255,255,255,0.6); border-radius: 50%; cursor: pointer; flex-shrink: 0; }
    .dot.active { background: white; width: 14px; border-radius: 4px; }

    .card-content { padding: 16px; display: flex; flex-direction: column; flex-grow: 1; }
    .badge { display: inline-block; background: #e0f2fe; color: #0369a1; padding: 3px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; width: fit-content; margin-bottom: 8px; }
    .card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 5px; color: #0f172a; }
    
    .price-box { margin-top: 5px; padding-top: 8px; border-top: 1px solid #f1f5f9; margin-bottom: 12px; }
    .price-usd { font-size: 1.3rem; font-weight: 800; color: #0f172a; }
    .price-cup { font-size: 0.85rem; color: #64748b; font-weight: 600; }

    .invoice-form { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .invoice-form label { font-size: 0.72rem; font-weight: 700; color: #475569; display: flex; flex-direction: column; gap: 2px; }
    .invoice-form input { padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.82rem; color: #0f172a; outline: none; }

    .buy-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--primary); color: white; padding: 11px; border-radius: 8px;
      font-weight: 700; font-size: 0.95rem; cursor: pointer; border: none; width: 100%; text-decoration: none;
      box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3); margin-top: auto;
    }
    .buy-btn:hover { background: #1da851; }

    footer { text-align: center; padding: 25px; color: #64748b; font-size: 0.85rem; margin-top: 40px; }
  </style>
</head>
