<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venta de Bicicletas y más</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        /* Custom smooth scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Glassmorphism effect for sticky bar */
        .glass-header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Carousel transitions */
        .carousel-slide {
            transition: opacity 0.3s ease-in-out;
        }

        /* Button click effect */
        .btn-active {
            transform: scale(0.97);
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <div>
        <!-- Sticky Navigation / Header -->
        <header class="glass-header sticky top-0 z-50 border-b border-slate-200/80 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-col md:flex-row items-center justify-between gap-4">
                
                <!-- Logo / Title -->
                <div class="flex items-center gap-3 text-center md:text-left">
                    <div class="w-12 h-12 bg-emerald-500 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-emerald-500/30">
                        <i class="fa-solid fa-bicycle text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-extrabold tracking-tight text-slate-900 leading-tight">
                            Venta de Bicicletas y más
                        </h1>
                        <p class="text-xs font-medium text-slate-500 flex items-center justify-center md:justify-start gap-1">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
                            Catálogo Oficial de Disponibilidad
                        </p>
                    </div>
                </div>

                <!-- Contact & Currency Exchange Bar -->
                <div class="flex flex-wrap items-center justify-center gap-3 w-full md:w-auto">
                    <!-- Exchange Rate Input -->
                    <div class="flex items-center bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-semibold">
                        <span class="text-slate-500 mr-2 flex items-center gap-1">
                            <i class="fa-solid fa-calculator text-slate-400"></i> Tasa CUP:
                        </span>
                        <input 
                            type="number" 
                            id="exchangeRateInput" 
                            value="320" 
                            min="1" 
                            class="w-16 bg-white border border-slate-300 rounded-lg px-2 py-1 text-center text-slate-800 font-bold focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all"
                            oninput="updateCurrencyExchange()"
                        >
                        <span class="ml-1 text-slate-500">CUP</span>
                    </div>

                    <!-- Direct WhatsApp Button -->
                    <a 
                        href="https://wa.me/5356255364" 
                        target="_blank" 
                        rel="noopener noreferrer"
                        class="flex items-center gap-2 bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow-md shadow-emerald-500/20 transition-all"
                    >
                        <i class="fa-brands fa-whatsapp text-base"></i>
                        <span>Contactar +53 56255364</span>
                    </a>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Filter Bar -->
            <section class="mb-8">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-emerald-500"></i> Filtrar por Medida:
                    </h2>
                    <span id="resultsCount" class="text-xs font-medium text-slate-500 bg-slate-200 px-2.5 py-1 rounded-full">
                        5 modelos disponibles
                    </span>
                </div>

                <!-- Filter Buttons -->
                <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none">
                    <button onclick="filterCatalog('all')" id="filter-all" class="filter-btn active-filter bg-slate-900 text-white px-4 py-2 rounded-xl text-sm font-semibold transition-all shadow-sm shrink-0">
                        Todas
                    </button>
                    <button onclick="filterCatalog('12')" id="filter-12" class="filter-btn bg-white hover:bg-slate-100 border border-slate-200 text-slate-700 px-4 py-2 rounded-xl text-sm font-semibold transition-all shrink-0">
                        Medida 12
                    </button>
                    <button onclick="filterCatalog('16')" id="filter-16" class="filter-btn bg-white hover:bg-slate-100 border border-slate-200 text-slate-700 px-4 py-2 rounded-xl text-sm font-semibold transition-all shrink-0">
                        Medida 16
                    </button>
                    <button onclick="filterCatalog('20')" id="filter-20" class="filter-btn bg-white hover:bg-slate-100 border border-slate-200 text-slate-700 px-4 py-2 rounded-xl text-sm font-semibold transition-all shrink-0">
                        Medida 20
                    </button>
                    <button onclick="filterCatalog('24')" id="filter-24" class="filter-btn bg-white hover:bg-slate-100 border border-slate-200 text-slate-700 px-4 py-2 rounded-xl text-sm font-semibold transition-all shrink-0">
                        Medida 24
                    </button>
                    <button onclick="filterCatalog('26')" id="filter-26" class="filter-btn bg-white hover:bg-slate-100 border border-slate-200 text-slate-700 px-4 py-2 rounded-xl text-sm font-semibold transition-all shrink-0">
                        Medida 26
                    </button>
                </div>
            </section>

            <section id="catalogGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Dynamic Bike Cards generated by JS -->
            </section>
        </main>
    </div>

    <footer class="bg-white border-t border-slate-200 mt-12 py-6">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500">
            <p class="font-medium text-slate-700 mb-1">Venta de Bicicletas y más © 2026</p>
            <p>Atención inmediata por WhatsApp al <a href="https://wa.me/5356255364" class="text-emerald-600 underline font-semibold">+53 56255364</a></p>
        </div>
    </footer>

    <script>
        // Exact Bicycle Catalog Dataset mapping the exact user image filenames
        const bikeCatalog = [
            {
                id: "medida-12",
                size: "12",
                title: "Bicicleta Infantil Medida 12",
                usdPrice: 150,
                description: "Ideal para los más pequeños en sus primeros pedalazos. Excelente estabilidad y diseño resistente.",
                images: [
                    "medida12-0.jpg",
                    "medida12-1.jpg",
                    "medida12-2.jpg",
                    "medida12-3.jpg",
                    "medida12-4.jpg"
                ]
            },
            {
                id: "medida-16",
                size: "16",
                title: "Bicicleta Medida 16",
                usdPrice: 165,
                description: "Perfecta para niños en crecimiento. Equipada con cuadro robusto y accesorios de máxima seguridad.",
                images: [
                    "medida16-1.jpg",
                    "medida16-2.jpg",
                    "medida16-3.jpg",
                    "medida16-4.jpg",
                    "medida16-5.jpg",
                    "medida16-6.jpg"
                ]
            },
            {
                id: "medida-20",
                size: "20",
                title: "Bicicleta Medida 20",
                usdPrice: 190,
                description: "Modelo dinámico y versátil. Excelente agarre, frenos seguros y múltiples opciones de color.",
                images: [
                    "medida20-1.jpg",
                    "medida20-2.jpg",
                    "medida20-3.jpg",
                    "medida20-4.jpg",
                    "medida20-5.jpg",
                    "medida20-6.jpg",
                    "medida20-7.jpg",
                    "medida20-8.jpg",
                    "medida20-9.jpg",
                    "medida20-10.jpg",
                    "medida20-11.jpg"
                ]
            },
            {
                id: "medida-24",
                size: "24",
                title: "Bicicleta Medida 24",
                usdPrice: 220,
                description: "Tamaño intermedio de gran durabilidad. Ideal tanto para paseos urbanos como para terrenos irregulares.",
                images: [
                    "medida24-1.jpg",
                    "medida24-2.jpg",
                    "medida24-3.jpg"
                ]
            },
            {
                id: "medida-26",
                size: "26",
                title: "Bicicleta Medida 26",
                usdPrice: 250,
                description: "Cuadro amplio de máxima comodidad y resistencia para adultos. Perfecta para el transporte diario.",
                images: [
                    "medida26-1.jpg",
                    "medida26-2.jpg"
                ]
            }
        ];

        // State variables tracking selected slide indices for each card
        const currentIndices = {};
        let activeFilter = 'all';

        // Initialize state on render
        bikeCatalog.forEach(bike => {
            currentIndices[bike.id] = 0;
        });

        function renderCatalog() {
            const container = document.getElementById('catalogGrid');
            const exchangeRate = parseFloat(document.getElementById('exchangeRateInput').value) || 320;
            
            const filteredBikes = activeFilter === 'all' 
                ? bikeCatalog 
                : bikeCatalog.filter(bike => bike.size === activeFilter);

            document.getElementById('resultsCount').innerText = `${filteredBikes.length} ${filteredBikes.length === 1 ? 'modelo disponible' : 'modelos disponibles'}`;

            container.innerHTML = filteredBikes.map(bike => {
                const currentIndex = currentIndices[bike.id] || 0;
                const totalImages = bike.images.length;
                const cupPrice = (bike.usdPrice * exchangeRate).toLocaleString('es-CU');
                const currentImage = bike.images[currentIndex];

                // Pre-filled WhatsApp message URL
                const waMessage = encodeURIComponent(`Hola, estoy interesado en comprar la bicicleta Medida ${bike.size} ($${bike.usdPrice} USD). ¿Sigue disponible?`);
                const waUrl = `https://wa.me/5356255364?text=${waMessage}`;

                return `
                    <div class="bg-white rounded-3xl border border-slate-200/80 shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden flex flex-col justify-between group">
                        
                        <!-- Card Image Gallery Section -->
                        <div class="relative bg-slate-100 aspect-[4/3] overflow-hidden select-none">
                            
                            <!-- Main Active Image -->
                            <img 
                                id="image-${bike.id}" 
                                src="${encodeURI(currentImage)}" 
                                alt="${bike.title}"
                                class="w-full h-full object-cover object-center transition-all duration-300"
                                onerror="this.onerror=null; this.src='https://placehold.co/600x450/e2e8f0/475569?text=Medida+${bike.size}';"
                            />

                            <!-- Size Badge Overlay -->
                            <div class="absolute top-3 left-3 bg-slate-900/80 backdrop-blur-md text-white font-bold text-xs px-3 py-1.5 rounded-full shadow-lg">
                                Medida ${bike.size}
                            </div>

                            <!-- Photo Counter Pill -->
                            <div class="absolute top-3 right-3 bg-black/60 backdrop-blur-md text-white font-semibold text-xs px-2.5 py-1 rounded-full flex items-center gap-1.5">
                                <i class="fa-solid fa-camera text-[10px]"></i>
                                <span id="counter-${bike.id}">${currentIndex + 1}/${totalImages}</span>
                            </div>

                            <!-- Carousel Controls (Previous / Next) -->
                            ${totalImages > 1 ? `
                                <button 
                                    onclick="navigateGallery('${bike.id}', -1)"
                                    class="absolute left-2 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white text-slate-800 w-9 h-9 rounded-full flex items-center justify-center shadow-md backdrop-blur-sm transition-all hover:scale-110 active:scale-95"
                                    aria-label="Foto Anterior"
                                >
                                    <i class="fa-solid fa-chevron-left text-xs"></i>
                                </button>
                                <button 
                                    onclick="navigateGallery('${bike.id}', 1)"
                                    class="absolute right-2 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white text-slate-800 w-9 h-9 rounded-full flex items-center justify-center shadow-md backdrop-blur-sm transition-all hover:scale-110 active:scale-95"
                                    aria-label="Siguiente Foto"
                                >
                                    <i class="fa-solid fa-chevron-right text-xs"></i>
                                </button>
                            ` : ''}

                            <!-- Dots Indicator at bottom of image -->
                            <div class="absolute bottom-2 left-0 right-0 flex justify-center gap-1 px-2">
                                ${bike.images.map((_, idx) => `
                                    <span 
                                        id="dot-${bike.id}-${idx}"
                                        class="h-1.5 rounded-full transition-all duration-300 ${idx === currentIndex ? 'w-5 bg-emerald-500' : 'w-1.5 bg-white/60'}"
                                    ></span>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Card Body Details -->
                        <div class="p-5 flex-1 flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-slate-900 text-lg mb-1 group-hover:text-emerald-600 transition-colors">
                                    ${bike.title}
                                </h3>
                                <p class="text-slate-500 text-xs leading-relaxed mb-4">
                                    ${bike.description}
                                </p>
                            </div>

                            <!-- Price Display & Action Button -->
                            <div class="pt-3 border-t border-slate-100 flex flex-col gap-3">
                                <div class="flex items-baseline justify-between">
                                    <div>
                                        <span class="text-xs text-slate-400 font-medium block">Precio Oficial</span>
                                        <span class="text-2xl font-extrabold text-slate-900">$${bike.usdPrice} <span class="text-xs font-bold text-emerald-600">USD</span></span>
                                    </div>
                                    <div class="text-right">
                                        <span class="text-xs text-slate-400 font-medium block">Equivalente CUP</span>
                                        <span class="text-sm font-bold text-slate-600">~${cupPrice} CUP</span>
                                    </div>
                                </div>

                                <!-- WhatsApp Order Button -->
                                <a 
                                    href="${waUrl}" 
                                    target="_blank" 
                                    rel="noopener noreferrer"
                                    class="w-full bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-md shadow-emerald-500/20 text-center flex items-center justify-center gap-2 text-sm transition-all transform hover:-translate-y-0.5"
                                >
                                    <i class="fa-brands fa-whatsapp text-lg"></i>
                                    <span>Encargar por WhatsApp</span>
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function navigateGallery(bikeId, direction) {
            const bike = bikeCatalog.find(b => b.id === bikeId);
            if (!bike) return;

            const total = bike.images.length;
            let newIndex = (currentIndices[bikeId] + direction + total) % total;
            currentIndices[bikeId] = newIndex;

            // Update Image Src
            const imgElement = document.getElementById(`image-${bikeId}`);
            if (imgElement) {
                imgElement.src = encodeURI(bike.images[newIndex]);
            }

            // Update Text Counter
            const counterElement = document.getElementById(`counter-${bikeId}`);
            if (counterElement) {
                counterElement.innerText = `${newIndex + 1}/${total}`;
            }

            // Update Dots Navigation
            bike.images.forEach((_, idx) => {
                const dot = document.getElementById(`dot-${bikeId}-${idx}`);
                if (dot) {
                    if (idx === newIndex) {
                        dot.className = "h-1.5 rounded-full transition-all duration-300 w-5 bg-emerald-500";
                    } else {
                        dot.className = "h-1.5 rounded-full transition-all duration-300 w-1.5 bg-white/60";
                    }
                }
            });
        }

        function filterCatalog(size) {
            activeFilter = size;

            // Update active state on filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-slate-900', 'text-white', 'shadow-sm');
                btn.classList.add('bg-white', 'text-slate-700', 'border', 'border-slate-200');
            });

            const activeBtn = document.getElementById(`filter-${size}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-white', 'text-slate-700', 'border', 'border-slate-200');
                activeBtn.classList.add('bg-slate-900', 'text-white', 'shadow-sm');
            }

            renderCatalog();
        }

        function updateCurrencyExchange() {
            renderCatalog();
        }

        window.onload = function() {
            renderCatalog();
        };
    </script>
</body>
</html>
