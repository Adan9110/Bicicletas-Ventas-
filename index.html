<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO y Nombre Oficial de la Tienda -->
  <title>BicicletasAdan - Venta de Bicicletas y Accesorios</title>
  <meta name="description" content="BicicletasAdan: Venta de bicicletas nuevas, repuestos y accesorios. ¡Consulta disponibilidad y compra directo por WhatsApp!">
  <meta name="keywords" content="BicicletasAdan, venta de bicicletas, bicicletas, repuestos, accesorios">

  <!-- Open Graph para vista previa en WhatsApp y Redes Sociales -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="BicicletasAdan">
  <meta property="og:description" content="BicicletasAdan: Venta de bicicletas nuevas, repuestos y accesorios. ¡Consulta disponibilidad y compra directo por WhatsApp!">
  <meta property="og:image" content="https://adan9110.github.io/Bicicletas-Ventas-/portada.jpg">
  <meta property="og:url" content="https://adan9110.github.io/Bicicletas-Ventas-/">

  <style>
    :root {
      --primary: #25d366;
      --dark: #0f172a;
      --light: #f8fafc;
      --accent: #0284c7;
      --card-bg: #ffffff;
      --text: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 90px;
    }

    header {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      padding: 2.5rem 1rem;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .logo-container {
      max-width: 380px;
      margin: 0 auto;
    }

    header p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-top: 8px;
    }

    .converter-bar {
      background: #ffffff;
      max-width: 800px;
      margin: -20px auto 20px;
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 90%;
    }

    .converter-bar label {
      font-weight: 600;
      font-size: 0.9rem;
      color: #475569;
    }

    .converter-input-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .converter-input-group input {
      width: 100px;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-weight: 700;
      color: #0f172a;
    }

    .filters {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 1.5rem auto;
      flex-wrap: wrap;
      max-width: 800px;
      padding: 0 10px;
    }

    .filter-btn {
      background: white;
      border: 1px solid #cbd5e1;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.85rem;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
    }

    .carousel {
      position: relative;
      width: 100%;
      height: 240px;
      background: #e2e8f0;
      overflow: hidden;
    }

    .carousel-track {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.35s ease-in-out;
    }

    .carousel-slide {
      min-width: 100%;
      width: 100%;
      height: 100%;
      flex-shrink: 0;
      cursor: pointer;
    }

    .carousel-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      z-index: 5;
    }

    .carousel-btn.prev { left: 10px; }
    .carousel-btn.next { right: 10px; }

    .carousel-dots {
      position: absolute;
      bottom: 10px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 5px;
      z-index: 5;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      cursor: pointer;
    }

    .dot.active {
      background: white;
      width: 16px;
      border-radius: 4px;
    }

    .card-content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .badge {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      width: fit-content;
      margin-bottom: 8px;
    }

    .price-box {
      margin-top: 5px;
      padding-top: 8px;
      border-top: 1px solid #f1f5f9;
      margin-bottom: 12px;
    }

    .price-usd {
      font-size: 1.3rem;
      font-weight: 800;
      color: #0f172a;
    }

    .price-cup {
      font-size: 0.85rem;
      color: #64748b;
      font-weight: 600;
    }

    .invoice-form {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }

    .invoice-form label {
      font-size: 0.72rem;
      font-weight: 700;
      color: #475569;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .invoice-form input {
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.82rem;
      color: #0f172a;
      outline: none;
    }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: auto;
    }

    .buy-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--primary);
      color: white;
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      width: 100%;
      text-decoration: none;
    }

    .add-cart-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--accent);
      color: white;
      padding: 9px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      border: none;
      width: 100%;
    }

    /* BOTÓN FLOTANTE DEL CARRITO */
    .cart-float-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: linear-gradient(135deg, #0284c7, #25d366);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 12px 22px;
      font-size: 1rem;
      font-weight: 800;
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 900;
    }

    .cart-badge-count {
      background: #ffffff;
      color: #0f172a;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 900;
    }

    /* MODAL DEL CARRITO */
    .cart-modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.75);
      z-index: 1001;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .cart-modal {
      background: white;
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
    }

    .cart-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 12px;
      margin-bottom: 15px;
    }

    .close-modal-btn {
      background: transparent;
      border: none;
      font-size: 1.5rem;
      font-weight: bold;
      color: #64748b;
      cursor: pointer;
    }
