<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO y Nombre Oficial de la Tienda -->
  <title>BicicletasAdan - Venta de Bicicletas y Accesorios</title>
  <meta name="description" content="BicicletasAdan: Venta de bicicletas nuevas, repuestos y accesorios. ¡Consulta disponibilidad y compra directo por WhatsApp!">
  <meta name="keywords" content="BicicletasAdan, venta de bicicletas, bicicletas, repuestos, accesorios">

  <!-- Open Graph para vista previa en WhatsApp y Redes Sociales -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="BicicletasAdan">
  <meta property="og:description" content="BicicletasAdan: Venta de bicicletas nuevas, repuestos y accesorios. ¡Consulta disponibilidad y compra directo por WhatsApp!">
  <meta property="og:image" content="https://adan9110.github.io/Bicicletas-Ventas-/portada.jpg">
  <meta property="og:url" content="https://adan9110.github.io/Bicicletas-Ventas-/">

  <style>
    :root {
      --primary: #25d366;
      --dark: #0f172a;
      --light: #f8fafc;
      --accent: #0284c7;
      --card-bg: #ffffff;
      --text: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 90px;
    }

    header {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      padding: 2.5rem 1rem;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .logo-container {
      max-width: 380px;
      margin: 0 auto;
    }

    header p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-top: 8px;
    }

    .converter-bar {
      background: #ffffff;
      max-width: 800px;
      margin: -20px auto 20px;
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 90%;
    }

    .converter-bar label {
      font-weight: 600;
      font-size: 0.9rem;
      color: #475569;
    }

    .converter-input-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .converter-input-group input {
      width: 100px;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-weight: 700;
      color: #0f172a;
    }

    .filters {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 1.5rem auto;
      flex-wrap: wrap;
      max-width: 800px;
      padding: 0 10px;
    }

    .filter-btn {
      background: white;
      border: 1px solid #cbd5e1;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.85rem;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
    }

    .carousel {
      position: relative;
      width: 100%;
      height: 250px;
      background: #e2e8f0;
      overflow: hidden;
    }

    .carousel-track {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.35s ease-in-out;
    }

    .carousel-slide {
      min-width: 100%;
      width: 100%;
      height: 100%;
      flex-shrink: 0;
      cursor: pointer;
    }

    .carousel-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      z-index: 5;
    }

    .carousel-btn.prev { left: 10px; }
    .carousel-btn.next { right: 10px; }

    .carousel-dots {
      position: absolute;
      bottom: 10px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 6px;
      z-index: 5;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .dot.active {
      background: white;
      width: 16px;
      border-radius: 4px;
    }

    #lightbox {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.92);
      justify-content: center;
      align-items: center;
    }

    #lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 8px;
      object-fit: contain;
    }

    #lightbox-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: white;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }

    .card-content {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .badge {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      width: fit-content;
      margin-bottom: 10px;
    }

    .price-box {
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid #f1f5f9;
      margin-bottom: 12px;
    }

    .price-usd {
      font-size: 1.3rem;
      font-weight: 800;
      color: #0f172a;
    }

    .price-cup {
      font-size: 0.85rem;
      color: #64748b;
      font-weight: 600;
    }

    .add-cart-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--accent);
      color: white;
      padding: 11px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      width: 100%;
      transition: background 0.2s;
    }

    .add-cart-btn:hover {
      background: #026496;
    }

    /* BOTÓN FLOTANTE DEL CARRITO ANIMADO */
    .cart-float-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: linear-gradient(135deg, #0284c7, #25d366);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 12px 22px;
      font-size: 1rem;
      font-weight: 800;
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 900;
    }

    .cart-badge-count {
      background: #ffffff;
      color: #0f172a;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 900;
    }

    /* MODAL DEL CARRITO DE COMPRAS */
    .cart-modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.75);
      z-index: 1001;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .cart-modal {
      background: white;
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
    }

    .cart-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 12px;
      margin-bottom: 15px;
    }

    .cart-modal-header h3 {
      font-size: 1.3rem;
      color: #0f172a;
    }

    .close-modal-btn {
      background: transparent;
      border: none;
      font-size: 1.5rem;
      font-weight: bold;
      color: #64748b;
      cursor: pointer;
    }

    .cart-items-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }

    .cart-item-title {
      font-weight: 700;
      font-size: 0.9rem;
    }

    .cart-item-price {
      font-size: 0.85rem;
      color: #64748b;
    }

    .remove-item-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: bold;
    }

    .cart-total-box {
      background: #e0f2fe;
      padding: 12px;
      border-radius: 8px;
      text-align: right;
      font-weight: 800;
      color: #0369a1;
      margin-bottom: 15px;
    }

    .invoice-form {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 15px;
    }

    .invoice-form label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #475569;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .invoice-form input {
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #0f172a;
      outline: none;
    }

    .checkout-btn {
      background: var(--primary);
      color: white;
      padding: 12px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      width: 100%;
      text-align: center;
      transition: background 0.2s;
    }

    .checkout-btn:hover {
      background: #1da851;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #64748b;
      font-size: 0.85rem;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <svg width="100%" height="auto" viewBox="0 0 500 110" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0284c7;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#25d366;stop-opacity:1" />
          </linearGradient>
        </defs>
        <g stroke="url(#grad1)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="40" cy="65" r="22" />
          <circle cx="120" cy="65" r="22" />
          <polyline points="40 65 65 30 100 30 120 65" />
          <polyline points="65 30 80 65 120 65" />
          <path d="M 60 25 L 70 25" />
          <path d="M 95 23 L 105 30" />
        </g>
        <text x="155" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="36" fill="#ffffff">
          Bicicletas<tspan fill="#25d366">Adan</tspan>
        </text>
        <text x="158" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#94a3b8" letter-spacing="1">
          VENTA & ACCESORIOS
        </text>
      </svg>
    </div>
    <p>Modelos disponibles para entrega inmediata</p>
  </header>

  <div class="converter-bar">
    <label for="exchange-rate">Tasa de cambio (USD ➔ CUP):</label>
    <div class="converter-input-group">
      <span>1 USD =</span>
      <input type="number" id="exchange-rate" value="320" onchange="updatePrices()">
      <span>CUP</span>
    </div>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="filterCategory('all')">Todas</button>
    <button class="filter-btn" onclick="filterCategory('12')">Medida 12</button>
    <button class="filter-btn" onclick="filterCategory('16')">Medida 16</button>
    <button class="filter-btn" onclick="filterCategory('20')">Medida 20</button>
    <button class="filter-btn" onclick="filterCategory('24')">Medida 24</button>
    <button class="filter-btn" onclick="filterCategory('26')">Medida 26</button>
  </div>

  <div class="container">
    <div class="grid" id="catalog"></div>
  </div>

  <!-- Botón Flotante del Carrito -->
  <button class="cart-float-btn" onclick="openCartModal()">
    🛒 Ver Carrito
    <span class="cart-badge-count" id="cart-count">0</span>
  </button>

  <!-- Modal Interactivo del Carrito -->
  <div class="cart-modal-overlay" id="cart-modal">
    <div class="cart-modal">
      <div class="cart-modal-header">
        <h3>🛒 Tu Carrito de Compras</h3>
        <button class="close-modal-btn" onclick="closeCartModal()">&times;</button>
      </div>

      <div class="cart-items-list" id="cart-items">
        <p style="text-align: center; color: #64748b; font-size: 0.9rem;">El carrito está vacío. Agrega una bicicleta para continuar.</p>
      </div>

      <div class="cart-total-box" id="cart-total">
        Total: $0 USD (≈ 0 CUP)
      </div>

      <div class="invoice-form">
        <label>Nombre del cliente:
          <input type="text" id="cart-name" placeholder="Ej. Carlos Pérez">
        </label>
        <label>Teléfono de contacto:
          <input type="tel" id="cart-phone" placeholder="Ej. +53 5xxxxxxx">
        </label>
        <label>Dirección de entrega:
          <input type="text" id="cart-address" placeholder="Ej. Calle 23 #45, La Habana">
        </label>
        <label>Día deseado para entrega:
          <input type="date" id="cart-date">
        </label>
      </div>

      <button class="checkout-btn" onclick="sendWhatsAppOrder()">
        📱 Pedir por WhatsApp
      </button>
    </div>
  </div>

  <div id="lightbox" onclick="closeLightbox()">
    <span id="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="Ampliada">
  </div>

  <footer>
    <p>BicicletasAdan • Contacto directo por WhatsApp: +53 56255364</p>
  </footer>

  <script>
    const products = [
      {
        id: 1,
        title: "Bicicleta Medida 12",
        category: "12",
        priceUSD: 150,
        images: [
          "medida12jpg.jpg",
          "medida122jpg.jpg",
          "medida123jpg.jpg",
          "medida124jpg.jpg"
        ]
      },
      {
        id: 2,
        title: "Bicicleta Medida 16",
        category: "16",
        priceUSD: 165,
        images: [
          "medida161jpg.jpg",
          "medida162jpg.jpg",
          "medida163jpg.jpg",
          "medida164jpg.jpg",
          "medida165jpg.jpg",
          "medida166jpg.jpg",
          "medida167jpg.jpg",
          "medida168jpg.jpg"
        ]
      },
      {
        id: 3,
        title: "Bicicleta Medida 20",
        category: "20",
        priceUSD: 190,
        images: [
          "medida201jpg.jpg",
          "medida202jpg.jpg",
          "medida203jpg.jpg",
          "medida204jpg.jpg",
          "medida205jpg.jpg",
          "medida206jpg.jpg",
          "medida207jpg.jpg",
          "medida208jpg.jpg",
          "medida209jpg.jpg",
          "medida2010jpg.jpg"
        ]
      },
      {
        id: 4,
        title: "Bicicleta Medida 24",
        category: "24",
        priceUSD: 220,
        images: [
          "medida241jpg.jpg",
          "medida242jpg.jpg",
          "medida243jpg.jpg",
          "medida244jpg.jpg"
        ]
      },
      {
        id: 5,
        title: "Bicicleta Medida 26",
        category: "26",
        priceUSD: 250,
        images: [
          "medida261jpg.jpg",
          "medida262jpg.jpg"
        ]
      }
    ];

    const phone = "5356255364";
    const currentSlides = {};
    let cart = [];

    function renderCatalog(items) {
      const catalog = document.getElementById('catalog');
      catalog.innerHTML = '';

      items.forEach(product => {
        if (currentSlides[product.id] === undefined) {
          currentSlides[product.id] = 0;
        }

        let slidesHTML = '';
        let dotsHTML = '';

        product.images.forEach((img, idx) => {
          slidesHTML += `<div class="carousel-slide" onclick="openLightbox('${img}')"><img src="${img}" alt="${product.title}" onerror="this.src='https://via.placeholder.com/400x300?text=Imagen+no+disponible'"></div>`;
          dotsHTML += `<span class="dot ${idx === currentSlides[product.id] ? 'active' : ''}" onclick="event.stopPropagation(); goToSlide(${product.id}, ${idx}, ${product.images.length})"></span>`;
        });

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="carousel" id="carousel-${product.id}">
            <div class="carousel-track" id="track-${product.id}" style="transform: translateX(-${currentSlides[product.id] * 100}%);">
              ${slidesHTML}
            </div>
            ${product.images.length > 1 ? `
              <button class="carousel-btn prev" onclick="event.stopPropagation(); changeSlide(${product.id}, -1,${product.images.length})">❮</button>
              <button class="carousel-btn next" onclick="event.stopPropagation(); changeSlide(${product.id}, 1,${product.images.length})">❯</button>
              <div class="carousel-dots" id="dots-${product.id}">
                ${dotsHTML}
              </div>
            ` : ''}
          </div>
          <div class="card-content">
            <span class="badge">Medida ${product.category}</span>
            <h2 class="card-title">${product.title}</h2>
            <div class="price-box">
              <div class="price-usd" id="price-usd-${product.id}">$${product.priceUSD} USD</div>
              <div class="price-cup" id="price-cup-${product.id}">o ≈ ... CUP</div>
            </div>

            <button class="add-cart-btn" onclick="addToCart(${product.id})">
               🛒 Añadir al carrito
            </button>
          </div>
        `;
        catalog.appendChild(card);
      });

      updatePrices();
    }

    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      if (product) {
        cart.push(product);
        updateCartUI();
        openCartModal();
      }
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
    }

    function updateCartUI() {
      document.getElementById('cart-count').textContent = cart.length;
      const cartItemsElem = document.getElementById('cart-items');
      const rate = parseFloat(document.getElementById('exchange-rate').value) || 320;

      if (cart.length === 0) {
        cartItemsElem.innerHTML = `<p style="text-align: center; color: #64748b; font-size: 0.9rem;">El carrito está vacío. Agrega una bicicleta para continuar.</p>`;
        document.getElementById('cart-total').textContent = `Total: $0 USD (≈ 0 CUP)`;
        return;
      }

      let itemsHTML = '';
      let totalUSD = 0;

      cart.forEach((item, index) => {
        totalUSD += item.priceUSD;
        itemsHTML += `
          <div class="cart-item">
            <div>
              <div class="cart-item-title">${item.title}</div>
              <div class="cart-item-price">$${item.priceUSD} USD</div>
            </div>
            <button class="remove-item-btn" onclick="removeFromCart(${index})"
